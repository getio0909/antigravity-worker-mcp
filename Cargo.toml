[package]
name = "antigravity-worker-mcp"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
autotests = false
description = "Asynchronous MCP worker for the official Google Antigravity CLI"
license = "MIT"
repository = "https://github.com/getio0909/antigravity-worker-mcp"
default-run = "antigravity-worker-mcp"
include = ["/src/**/*.rs", "/tests/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/licenses/**", "/docs/**", "/examples/**", "/CONTRIBUTING.md", "/SECURITY.md", "/CHANGELOG.md"]

[features]
test-fixtures = []

[[bin]]
name = "antigravity-worker-mcp"
path = "src/main.rs"

[[bin]]
name = "agy-fixture"
path = "tests/fixture.rs"
required-features = ["test-fixtures"]

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["test-fixtures"]

[dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Console"] }

[dev-dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-child-process"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
