name: CI and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: 1.97.1
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux isolation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap git
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --target '${{ matrix.target }}'
      - name: Check public text and tag version
        shell: bash
        run: |
          if git grep -n -I -P '\p{Han}'; then
            echo 'Public project files must not contain Chinese text.' >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Format
        shell: bash
        run: cargo +"$RUST_VERSION" fmt --check
      - name: Test npm launcher
        shell: bash
        run: |
          node --version
          npm test
      - name: Lint
        shell: bash
        run: cargo +"$RUST_VERSION" clippy --locked --target '${{ matrix.target }}' --all-targets --all-features -- -D warnings
      - name: Test
        shell: bash
        run: cargo +"$RUST_VERSION" test --locked --target '${{ matrix.target }}' --all-features
      - name: Build release
        shell: bash
        run: cargo +"$RUST_VERSION" build --locked --release --target '${{ matrix.target }}' --bin antigravity-worker-mcp
      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash .github/scripts/package.sh
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: ./.github/scripts/package.ps1
      - name: Verify native archive and launcher extraction
        shell: bash
        run: node .github/scripts/check-package.mjs '${{ matrix.target }}'
      - name: Pack npm launcher
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination artifacts
          version=$(node --input-type=module -e 'import { VERSION } from "./npm/lib/launcher.mjs"; console.log(VERSION)')
          (cd artifacts && sha256sum "antigravity-worker-mcp-$version.tgz" > "antigravity-worker-mcp-$version.tgz.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish all-platform release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Verify and collect platform archives
        shell: bash
        run: |
          mkdir release
          for directory in artifacts/*; do
            (cd "$directory" && sha256sum --check -- ./*.sha256)
          done
          shopt -s nullglob
          archives=(artifacts/*/*.tar.gz artifacts/*/*.zip)
          test "${#archives[@]}" -eq 6
          npm_packages=(artifacts/*/*.tgz)
          test "${#npm_packages[@]}" -eq 1
          cp "${archives[@]}" "${npm_packages[@]}" release/
          (cd release && sha256sum -- *.tar.gz *.zip *.tgz > SHA256SUMS)
      - name: Verify release manifest with the launcher
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile, readdir } from 'node:fs/promises';
          import { checksumFor, hashFile } from './npm/lib/launcher.mjs';
          const manifest = await readFile('release/SHA256SUMS', 'utf8');
          const files = (await readdir('release')).filter(name => name !== 'SHA256SUMS');
          assert.equal(files.length, 7);
          for (const name of files) assert.equal(await hashFile(`release/${name}`), checksumFor(manifest, name));
          console.log('Verified all seven release files against the launcher manifest format.');
          JS
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md --prerelease
